<html>
<head>
    <title>Angular 2 QuickStart</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">

    <link rel="stylesheet" href="app/bower_components/bootstrap/dist/css/bootstrap.css" />
    <link rel="stylesheet" href="app/app.css" />
    <script src="app/bower_components/angular/angular.js"></script>
    <script src="app/app.js"></script>
    <script src="app/container.component.js"></script>

    <script src="app/passengers/passenger-list.module.js"></script>
    <script src="app/passengers/passenger-list.component.js"></script>

    <!-- 1. Load libraries -->
    <!-- Polyfill(s) for older browsers -->
    <script src="node_modules/core-js/client/shim.min.js"></script>
    <script src="node_modules/zone.js/dist/zone.js"></script>
    <script src="node_modules/reflect-metadata/Reflect.js"></script>
    <script src="node_modules/systemjs/dist/system.src.js"></script>
    <!-- 2. Configure SystemJS -->
    <script src="systemjs.config.js"></script>
    <script>
        System.import('app').catch(function(err){ console.error(err); });
    </script>
</head>
<!-- 3. Display the application -->
<body>
<div class="view-container">
    <div ng-view class="view-frame"></div>
</div>
<my-app>Loading...</my-app>
<container></container>
</body>
</html>
