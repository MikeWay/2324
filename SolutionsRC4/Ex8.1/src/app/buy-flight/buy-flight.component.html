<div class="row">
  <div class="col-md-6">Filter by:</div>
</div>
<app-flight-filter (onFilter)="onFilterChange($event)" [label]="'Origin'"></app-flight-filter>
<app-flight-filter (onFilter)="onDestinationFilterChange($event)" [label]="'Destination'"></app-flight-filter>
<div class="row">
  <div class="col-md-6">&nbsp;</div>
</div>
<h2 *ngIf="errorMessage" class="bg-danger text-danger">{{errorMessage}}</h2>
<table *ngIf="showBuyFlights" class="table table-bordered table-condensed table-responsive">
  <thead><tr><th></th><th>Flight</th><th>From</th><th>To</th><th>Departure Day</th><th>Departure Time</th><th>Arrival Day</th><th>Arrival Time</th><th>Price</th></tr></thead>

  <tbody>
  <tr *ngFor="let flight of flights">
    <td><button (click)="onFlightClick(flight)" class="btn btn-primary btn-sm">Buy</button></td>
    <td>{{flight.flightNumber}}</td>
    <td>{{flight.origin}}</td>
    <td>{{flight.destination}}</td>
    <td>{{flight.departDay}}</td>
    <td>{{flight.departTime}}</td>
    <td>{{flight.arriveDay}}</td>
    <td>{{flight.arriveTime}}</td>
    <td>{{flight.price | currencyConversion : 0.5}}</td>
  </tr>
  </tbody>
</table>

<app-payment [selectedFlight]="selectedFlight"></app-payment>
