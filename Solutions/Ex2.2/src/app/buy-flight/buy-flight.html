@if (showBuyFlights) {
  <table>
    @for (flight of flights; track flight.id) {
      <tr>
        <td>{{flight.flightNumber}}</td>
        <td>{{flight.origin}}</td>
        <td>{{flight.destination}}</td>
        <td>{{flight.departDay}} {{flight.departTime}}</td>
        <td>{{flight.arriveDay}} {{flight.arriveTime}}</td>
        <td>{{flight.price}}</td>
      </tr>
    }
  </table>
}
<a href='#' (click)="showBuyFlights = !showBuyFlights">Toggle Flights</a>
