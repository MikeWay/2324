<app-flight-filter (filterEmitter) = "onOriginFilterChange($event)" label="origin" [initialValue]="originFilter"></app-flight-filter>
<app-flight-filter (filterEmitter) = "onDestinationFilterChange($event)" label="destination" [initialValue]="destinationFilter"></app-flight-filter>
<table *ngIf="showBuyFlights" class="table table-condensed table-responsive">
    <thead>
        <tr>
            <th></th>
            <th>Flight</th>
            <th>From</th>
            <th>To</th>
            <th>Departure</th>
            <th>Arrival</th>
            <th>Price</th>
        </tr>
    </thead>    
    <tbody>
        <tr *ngFor="let flight of flights">
            <td><button (click)="onFlightClick(flight)" class="btn btn-primary btn-sm">Buy</button></td>
            <td>{{flight.flightNumber}}</td>
            <td>{{flight.origin}}</td>
            <td>{{flight.destination}}</td>
            <td>{{flight.departDay}} {{flight.departTime}}</td>
            <td>{{flight.arriveDay}} {{flight.arriveTime}}</td>
            <td>{{flight.price}}</td>
        </tr>
    </tbody>
</table>

<a href='#' (click)="onClickBuyFlights()">Toggle Flights</a>

<app-payment [selectedFlight]="selectedFlight"></app-payment>
