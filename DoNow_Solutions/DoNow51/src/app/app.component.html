<header><h1>Pseudo Keys Example</h1></header>

<div class="row">
  <div class="col-md-12">
<input #userInput
       (keyup.enter)="enteredValue=userInput.value"
       (keyup)="allKeys=userInput.value"
       placeholder="Type in here and hit enter"
       class="form-control">
<p class="text-primary">Value when enter pressed appears here here: [{{enteredValue}}]</p>
<p class="text-primary">Every key pressed appears here [{{userInput.value}}]</p>
    </div>
</div>
