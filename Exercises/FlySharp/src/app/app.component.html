<mat-toolbar>
  <mat-icon (click)="nav.toggle()">menu</mat-icon>
  <span class='title'>FlySharp</span>
  <app-currency-selector></app-currency-selector>
</mat-toolbar>
<mat-sidenav-container>
  <mat-sidenav #nav>
    <mat-nav-list>
      <a mat-list-item class="nav-link" routerLink='/home' (click)="nav.toggle()">Home</a>
      <a mat-list-item class="nav-link" routerLink='/buy' (click)="nav.toggle()">Buy Flights</a>
      <a mat-list-item class="nav-link" routerLink='/myflights' (click)="nav.toggle()">My Flights</a>
      <a mat-list-item class="nav-link" routerLink='/account' (click)="nav.toggle()">Account</a>         
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
