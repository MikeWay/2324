<!-- Material Starts Here-->
<mat-toolbar color="primary">
  <mat-icon (click)="nav.toggle()">menu</mat-icon>
  <span class='title'>FlySharp</span>
  <span class="spacer"></span>
  <span appTime='white' class="label label-primary"></span>
  <span class="spacer"></span><app-currency></app-currency>
</mat-toolbar>
<mat-sidenav-container>
  <mat-sidenav #nav>
    <mat-nav-list>
      <a mat-list-item class="nav-link" routerLink='/home'>Home</a>
      <a mat-list-item class="nav-link" routerLink='/buy'>Buy Flights</a>
      <a mat-list-item class="nav-link" routerLink='/myflights'>My Flights</a>
      <a mat-list-item class="nav-link" routerLink='/account'>Account</a>
   </mat-nav-list>    
  </mat-sidenav>
  <mat-sidenav-content>
    <router-outlet></router-outlet>    
  </mat-sidenav-content>
</mat-sidenav-container>
